name: CD - Deploy AWS Infrastructure and Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy infrastructure and images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_REGION: us-east-1
      PROJECT: hackaton

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply AWS infrastructure
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/api/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:latest
          cache-to:   type=inline

      - name: Build & push — Processor
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/processor/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:latest
          cache-to:   type=inline

      - name: Build & push — Notification
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/notification/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:latest
          cache-to:   type=inline

      - name: Build summary
        run: |
          echo "### Imagens publicadas no ECR ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| api | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| processor | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| notification | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Verify published images
        run: |
          for service in api processor notification; do
            aws ecr describe-images \
              --repository-name "${PROJECT}-${service}" \
              --image-ids imageTag="${{ github.event.workflow_run.head_sha }}" \
              --query 'imageDetails[0].imageDigest' \
              --output text | grep -q '^sha256:'
          done
