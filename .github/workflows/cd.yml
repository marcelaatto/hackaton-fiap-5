name: CD — Deploy to AWS

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Build e Push para o ECR ────────────────────────────────────────────────
  build_push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}

    env:
      AWS_REGION: us-east-1
      PROJECT: hackaton

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/api/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:latest
          cache-to:   type=inline

      - name: Build & push — Processor
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/processor/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:latest
          cache-to:   type=inline

      - name: Build & push — Notification
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    services/notification/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:latest
          cache-to:   type=inline

      - name: Build summary
        run: |
          echo "### Imagens publicadas no ECR ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| api | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| processor | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| notification | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy para o ECS ──────────────────────────────────────────────────────
  deploy_ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build_push
    continue-on-error: true

    env:
      AWS_REGION: us-east-1
      PROJECT: hackaton

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ env.PROJECT }}-api
          service:         ${{ env.PROJECT }}-api
          cluster:         ${{ env.PROJECT }}-cluster
          wait-for-service-stability: false
          image:          ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-api:${{ github.event.workflow_run.head_sha }}
          container-name: ${{ env.PROJECT }}-api

      - name: Deploy Processor to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ env.PROJECT }}-processor
          service:         ${{ env.PROJECT }}-processor
          cluster:         ${{ env.PROJECT }}-cluster
          wait-for-service-stability: false
          image:          ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-processor:${{ github.event.workflow_run.head_sha }}
          container-name: ${{ env.PROJECT }}-processor

      - name: Deploy Notification to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ env.PROJECT }}-notification
          service:         ${{ env.PROJECT }}-notification
          cluster:         ${{ env.PROJECT }}-cluster
          wait-for-service-stability: false
          image:          ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-notification:${{ github.event.workflow_run.head_sha }}
          container-name: ${{ env.PROJECT }}-notification
