name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Testes ────────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hackaton
          POSTGRES_PASSWORD: hackaton
          POSTGRES_DB: hackaton
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3,sqs
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: hackaton
      DB_USER: hackaton
      DB_PASS: hackaton
      REDIS_URL: redis://localhost:6379
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ENDPOINT_URL_PUBLIC: http://localhost:4566
      S3_BUCKET_VIDEOS: hackaton-videos
      S3_BUCKET_ZIPS: hackaton-zips
      SQS_QUEUE_URL: http://localhost:4566/000000000000/video-jobs
      SQS_FAILURES_QUEUE_URL: http://localhost:4566/000000000000/video-failures
      JWT_SECRET: test-jwt-secret-ci
      JWT_EXPIRES_IN: 24h
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Init LocalStack (S3 + SQS)
        run: |
          pip install awscli-local --quiet
          awslocal s3 mb s3://hackaton-videos
          awslocal s3 mb s3://hackaton-zips
          awslocal sqs create-queue --queue-name video-jobs-dlq
          awslocal sqs create-queue --queue-name video-failures
          awslocal sqs create-queue --queue-name video-jobs \
            --attributes '{"VisibilityTimeout":"300","RedrivePolicy":"{\\"deadLetterTargetArn\\":\\"arn:aws:sqs:us-east-1:000000000000:video-jobs-dlq\\",\\"maxReceiveCount\\":\\"3\\"}"}'          
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Test API (unit + integration + BDD)
        run: npm run test:api

      - name: Test Processor
        run: npm run test:processor

      - name: Test Notification
        run: npm run test:notification

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          retention-days: 7
          path: |
            services/api/coverage/lcov.info
            services/processor/coverage/lcov.info
            services/notification/coverage/lcov.info

  # ─── SonarCloud ────────────────────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
