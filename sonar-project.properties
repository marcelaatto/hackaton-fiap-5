# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURAÇÃO DO SONARCLOUD
#
# Antes de usar, substitua os dois campos abaixo:
#   sonar.projectKey   → Copie do painel SonarCloud após criar o projeto
#   sonar.organization → Slug da sua organização (ex: seu-usuario-github)
#
# Como criar o projeto:
#   1. Acesse https://sonarcloud.io e faça login com GitHub
#   2. Clique em "+" → "Analyze new project"
#   3. Selecione o repositório hackaton-fiap-5
#   4. Copie o projectKey e organization gerados
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=marcelaatto_hackaton-fiap-5
sonar.organization=marcelaatto
sonar.projectName=Hackaton FIAP X - Sistema de Processamento de Vídeos
sonar.projectVersion=1.0.0

# Código-fonte dos três microsserviços + shared
sonar.sources=services/api/src,services/processor/src,services/notification/src,shared/src

# Diretórios de testes
sonar.tests=services/api/tests,services/processor/tests,services/notification/tests

# Relatórios de cobertura LCOV gerados por "npm test" com --coverage
sonar.javascript.lcov.reportPaths=\
  services/api/coverage/lcov.info,\
  services/processor/coverage/lcov.info,\
  services/notification/coverage/lcov.info

# Arquivos excluídos da análise
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/legacy/**,\
  **/*.test.js,\
  infrastructure/**

# Arquivos de teste reconhecidos pelo Sonar
sonar.test.inclusions=**/*.test.js,**/features/*.feature
